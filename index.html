<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>মাটি ও মৃৎশিল্প ইনভয়েজ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

    :root {
      --primary-color: #1ABC9C;
      --secondary-color: #2980B9;
      --accent-color: #27AE60;
      --btn-blue: #3498DB;
      --text-color: #2c3e50;
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 20px 10px;
      margin: 0;
      color: var(--text-color);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
      box-sizing: border-box;
    }

    .header-logo {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      padding-bottom: 20px;
    }

    .header-logo h1 {
      color: var(--secondary-color);
      font-size: clamp(24px, 8vw, 38px);
      margin: 0;
    }

    .date-info {
      text-align: right;
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 15px;
      color: var(--secondary-color);
    }

    /* মাল্টি-সিলেক্ট ড্রপডাউন স্টাইল */
    .multiselect-container {
      position: relative;
      width: 100%;
      margin-top: 8px;
    }

    .select-box {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .overSelect {
      position: absolute;
      left: 0; right: 0; top: 0; bottom: 0;
    }

    #checkboxes {
      display: none;
      border: 1px solid #ddd;
      border-radius: 8px;
      max-height: 600px; /* হাইট কিছুটা বাড়ানো হয়েছে ভালো ভিউর জন্য */
      overflow-y: auto;
      background-color: #fff;
      position: absolute;
      /* আপডেট: ড্রপডাউনটি স্ক্রিনের ৮০% জুড়ে দেখানোর জন্য */
      width: 80vw; 
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* বড় স্ক্রিনে যেন আবার খুব বেশি বড় না হয়ে যায় */
    @media (min-width: 800px) {
      #checkboxes {
        width: 100%; 
        left: 0;
        transform: none;
      }
    }

    #checkboxes label {
      display: flex;
      align-items: center;
      padding: 12px;
      margin: 0;
      font-weight: 400;
      color: var(--text-color);
      border-bottom: 1px solid #f1f1f1;
      cursor: pointer;
    }

    #checkboxes label:hover {
      background-color: #f9f9f9;
    }

    #checkboxes input {
      width: auto;
      margin-right: 15px;
      margin-top: 0;
      transform: scale(1.2); /* চেকবক্স একটু বড় করা হয়েছে */
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
      font-family: inherit;
    }

    .summary {
      background: #f9f9f9;
      padding: 10px 15px;
      margin-top: 20px;
      border-radius: 10px;
      border: 1px solid #eee;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      gap: 10px;
    }

    .item-row span {
      flex: 1;
      font-size: 14px;
    }

    .quantity-buttons {
      display: flex;
      gap: 5px;
    }

    .quantity-buttons button {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background-color: var(--btn-blue);
      color: white;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .input-grid {
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px;
    }

    @media (max-width: 600px) {
      .input-grid { grid-template-columns: 1fr; }
      .btn-group { flex-direction: column; }
      .container { padding: 20px 15px; }
    }

    .totals-box {
      background: #fdfdfd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      border: 1px solid #eee;
    }

    .totals-box p {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 15px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-main {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      color: white;
      font-size: 16px;
      text-align: center;
    }

    .btn-submit { background: var(--primary-color); }
    .btn-clear { background: #e74c3c; }

    .footer-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .footer-actions button { 
      background: var(--secondary-color); 
      padding: 12px 5px;
      border-radius: 8px;
      border: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    #invoiceText {
      height: 200px;
      margin-top: 20px;
      background: #fcfcfc;
      resize: none;
    }

    @media print {
      @page { size: A4; margin: 1cm; }
      body { background: white; padding: 0; }
      .container { box-shadow: none; border: none; width: 100%; max-width: 100%; padding: 0; }
      .no-print { display: none !important; }
      .summary, .totals-box { border: 1px solid #eee; }
      #finalSummary { display: block !important; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="container" id="printableArea">
    <div class="header-logo">
      <h1>মাটি ও মৃৎশিল্প</h1>
      <p style="margin: 5px 0; color: #666; font-size: 14px;">প্রাকৃতিক ও শৈল্পিক মৃৎপণ্যের বিশ্বস্ত প্রতিষ্ঠান</p>
    </div>

    <div class="date-info">তারিখ: <span id="currentDate"></span></div>

    <div class="no-print">
      <label>🛒 পণ্য সিলেক্ট করুন</label>
      <div class="multiselect-container">
        <div class="select-box" onclick="toggleCheckboxes()">
          <span id="selectPlaceholder">-- পণ্য নির্বাচন করুন --</span>
          <span style="font-size: 12px;">▼</span>
        </div>
        <div id="checkboxes">
          <label><input type="checkbox" value="380" data-name="বড় তরকারি পাতিল ঢাকনা সহ"> বড় তরকারি পাতিল ঢাকনা সহ - ৩৮০ টাকা</label>
          <label><input type="checkbox" value="330" data-name="বড় তরকারি পাতিল (ঢাকনা ছাড়া)"> 🔴 বড় তরকারি পাতিল (ঢাকনা ছাড়া) - ৩৩০ টাকা</label>
          <label><input type="checkbox" value="330" data-name="ছোট তরকারি পাতিল ঢাকনা সহ"> ছোট তরকারি পাতিল ঢাকনা সহ - ৩৩০ টাকা</label>
          <label><input type="checkbox" value="280" data-name="ছোট তরকারি পাতিল (ঢাকনা ছাড়া)"> 🔴 ছোট তরকারি পাতিল (ঢাকনা ছাড়া) - ২৮০ টাকা</label>
          <label><input type="checkbox" value="370" data-name="বড় কড়াই ঢাকনা সহ"> বড় কড়াই ঢাকনা সহ - ৩৭০ টাকা</label>
          <label><input type="checkbox" value="320" data-name="বড় কড়াই (ঢাকনা ছাড়া)"> 🔴 বড় কড়াই (ঢাকনা ছাড়া) - ৩২০ টাকা</label>
          <label><input type="checkbox" value="270" data-name="ছোট কড়াই ঢাকনা সহ"> ছোট কড়াই ঢাকনা সহ - ২৭০ টাকা</label>
          <label><input type="checkbox" value="220" data-name="ছোট কড়াই (ঢাকনা ছাড়া)"> 🔴 ছোট কড়াই (ঢাকনা ছাড়া) - ২২০ টাকা</label>
          <label><input type="checkbox" value="370" data-name="বড় ভাতের পাতিল ঢাকনা সহ"> বড় ভাতের পাতিল ঢাকনা সহ - ৩৭০ টাকা</label>
          <label><input type="checkbox" value="320" data-name="বড় ভাতের পাতিল (ঢাকনা ছাড়া)"> 🔴 বড় ভাতের পাতিল (ঢাকনা ছাড়া) - ৩২০ টাকা</label>
          <label><input type="checkbox" value="320" data-name="মাঝারি ভাতের পাতিল ঢাকনা সহ"> মাঝারি ভাতের পাতিল ঢাকনা সহ - ৩২০ টাকা</label>
          <label><input type="checkbox" value="270" data-name="মাঝারি ভাতের পাতিল (ঢাকনা ছাড়া)"> 🔴 মাঝারি ভাতের পাতিল (ঢাকনা ছাড়া) - ২৭০ টাকা</label>
          <label><input type="checkbox" value="270" data-name="ছোট ভাতের পাতিল ঢাকনা সহ"> ছোট ভাতের পাতিল ঢাকনা সহ - ২৭০ টাকা</label>
          <label><input type="checkbox" value="220" data-name="ছোট ভাতের পাতিল (ঢাকনা ছাড়া)"> 🔴 ছোট ভাতের পাতিল (ঢাকনা ছাড়া) - ২২০ টাকা</label>
          <label><input type="checkbox" value="250" data-name="চায়ের পাতিল ঢাকনা সহ"> চায়ের পাতিল ঢাকনা সহ - ২৫০ টাকা</label>
          <label><input type="checkbox" value="330" data-name="দুধ/ডাল পাতিল ঢাকনা সহ"> দুধ/ডাল পাতিল ঢাকনা সহ - ৩৩০ টাকা</label>
          <label><input type="checkbox" value="280" data-name="দুধ/ডাল পাতিল (ঢাকনা ছাড়া)"> 🔴 দুধ/ডাল পাতিল (ঢাকনা ছাড়া) - ২৮০ টাকা</label>
          <label><input type="checkbox" value="370" data-name="স্টিমার পাতিল ঢাকনা সহ"> স্টিমার / পিঠা ভাপে সেদ্ধ করার পাতিল ঢাকনা সহ - ৩৭০ টাকা</label>
          <label><input type="checkbox" value="320" data-name="স্টিমার পাতিল (ঢাকনা ছাড়া)"> 🔴স্টিমার / পিঠা ভাপে সেদ্ধ করার পাতিল (ঢাকনা ছাড়া) - ৩২০ টাকা</label>
          <label><input type="checkbox" value="370" data-name="ভাপা পিঠার পাতিল ঢাকনা সহ"> ভাপা পিঠার পাতিল ঢাকনা সহ - ৩৭০ টাকা</label>
          <label><input type="checkbox" value="420" data-name="ভাপা পিঠার পাতিল বাটি সহ"> ভাপা পিঠার পাতিল পিঠার বাটি সহ - ৪২০ টাকা</label>
          <label><input type="checkbox" value="220" data-name="চিতই পিঠার খোলা ঢাকনা সহ"> চিতই পিঠার খোলা ঢাকনা সহ - ২২০ টাকা</label>
          <label><input type="checkbox" value="270" data-name="খোলজা পিঠার খোলা ঢাকনা সহ"> খোলজা পিঠার খোলা ঢাকনা সহ - ২৭০ টাকা</label>
          <label><input type="checkbox" value="370" data-name="৭ খোপের চিতই পিঠার ছাঁচ"> ৭ খোপের চিতই পিঠার ছাঁচ ঢাকনা সহ - ৩৭০ টাকা</label>
          <label><input type="checkbox" value="320" data-name="৫ খোপের চিতই পিঠার ছাঁচ"> ৫ খোপের চিতই পিঠার ছাঁচ ঢাকনা সহ - ৩২০ টাকা</label>
          <label><input type="checkbox" value="250" data-name="তাওয়া"> তাওয়া - ২৫০ টাকা</label>
          <label><input type="checkbox" value="110" data-name="জলকান্দা"> জলকান্দা (পাতিল বসানোর পাত্র) - ১১০ টাকা</label>
          <label><input type="checkbox" value="250" data-name="কয়েলদানি"> কয়েলদানি - ২৫০ টাকা</label>
          <label><input type="checkbox" value="120" data-name="বাটি"> বাটি - ১২০ টাকা</label>
          <label><input type="checkbox" value="220" data-name="প্লেট"> প্লেট - ২২০ টাকা</label>
          <label><input type="checkbox" value="150" data-name="গোল গ্লাস"> গোল গ্লাস - ১৫০ টাকা</label>
          <label><input type="checkbox" value="130" data-name="নরমাল গ্লাস"> নরমাল গ্লাস - ১৩০ টাকা</label>
          <label><input type="checkbox" value="1200" data-name="১৪ লিটার কলসি (সেট)"> ১৪ লিটার কলসি (ট্যাপ, ঢাকনা ও জলকান্দা সহ) - ১২০০ টাকা</label>
          <label><input type="checkbox" value="850" data-name="৭ লিটার কলসি (সেট)"> ৭ লিটার কলসি (ট্যাপ, ঢাকনা ও জলকান্দা সহ) - ৮৫০ টাকা</label>
          <label><input type="checkbox" value="750" data-name="৫ লিটার কলসি (সেট)"> ৫ লিটার কলসি (ট্যাপ, ঢাকনা ও জলকান্দা সহ) - ৭৫০ টাকা</label>
        </div>
      </div>
    </div>

    <div id="selectedItems" class="summary">
      <p style="text-align:center; color:#999;">কোন পণ্য যোগ করা হয়নি</p>
    </div>

    <div class="no-print input-grid">
      <div>
        <label>🚚 ডেলিভারি চার্জ</label>
        <input type="number" id="deliveryCharge" placeholder="৳">
      </div>
      <div>
        <label>💳 অগ্রিম পেমেন্ট</label>
        <input type="number" id="paymentAmount" placeholder="৳">
      </div>
      <div>
        <label>🎁 ডিসকাউন্ট</label>
        <input type="number" id="discountAmount" placeholder="৳">
      </div>
    </div>

    <div class="btn-group no-print">
      <button class="btn-main btn-submit" onclick="submitInvoice()">ইনভয়েজ তৈরি করুন</button>
      <button class="btn-main btn-clear" onclick="clearAll()">মুছে ফেলুন</button>
    </div>

    <div class="totals-box" id="finalSummary" style="display: none;">
      <p>পণ্যের মোট মূল্য: <span id="sumProductTotal">৳ ০</span></p>
      <p>ডেলিভারি চার্জ: <span id="sumDelivery">৳ ০</span></p>
      <p id="discountRow" style="color: #e74c3c;">ডিসকাউন্ট: <span id="sumDiscount">৳ ০</span></p>
      <p style="font-weight:bold; font-size: 1.1em; border-top: 1px solid #ddd; padding-top: 10px;">
        সর্বমোট বিল: <span id="sumFinalTotal">৳ ০</span>
      </p>
      <p style="color: var(--accent-color); font-weight: bold;">পরিশোধিত: <span id="sumPaid">৳ ০</span></p>
      <p style="color: #e74c3c; font-weight: bold;">বকেয়া (COD): <span id="sumDue">৳ ০</span></p>
    </div>

    <textarea id="invoiceText" class="no-print" readonly placeholder="কপি করার টেক্সট এখানে আসবে..."></textarea>

    <div class="footer-actions no-print">
      <button onclick="copyText()">📋 কপি টেক্সট</button>
      <button onclick="downloadPDF()">📄 PDF ডাউনলোড</button>
      <button onclick="window.print()">🖨️ প্রিন্ট ইনভয়েজ</button>
    </div>
  </div>

  <script>
    let selectedItems = [];
    let expanded = false;

    function toggleCheckboxes() {
      const checkboxes = document.getElementById("checkboxes");
      if (!expanded) {
        checkboxes.style.display = "block";
        expanded = true;
      } else {
        checkboxes.style.display = "none";
        expanded = false;
      }
    }

    // ড্রপডাউনের বাইরে ক্লিক করলে সেটি বন্ধ হয়ে যাবে
    window.addEventListener('click', function(e){   
      if (!document.querySelector('.multiselect-container').contains(e.target)){
        document.getElementById("checkboxes").style.display = "none";
        expanded = false;
      }
    });

    // চেকবক্স হ্যান্ডলিং
    document.querySelectorAll('#checkboxes input').forEach(checkbox => {
      checkbox.addEventListener('change', function() {
        const price = parseInt(this.value);
        const name = this.getAttribute('data-name');
        
        if (this.checked) {
          selectedItems.push({ name: name, price: price, quantity: 1 });
        } else {
          selectedItems = selectedItems.filter(item => item.name !== name);
        }
        renderItems();
        updatePlaceholder();
      });
    });

    function updatePlaceholder() {
      const placeholder = document.getElementById("selectPlaceholder");
      const count = selectedItems.length;
      placeholder.innerText = count > 0 ? `${count}টি পণ্য সিলেক্ট করা হয়েছে` : "-- পণ্য নির্বাচন করুন --";
    }

    function updateDate() {
      const today = new Date();
      document.getElementById("currentDate").textContent = today.toLocaleDateString("bn-BD", { year: "numeric", month: "long", day: "numeric" });
    }

    function changeQty(index, delta) {
      selectedItems[index].quantity += delta;
      if (selectedItems[index].quantity <= 0) {
        // আনচেক দ করসপন্ডিং বক্স
        const itemName = selectedItems[index].name;
        document.querySelectorAll('#checkboxes input').forEach(cb => {
          if(cb.getAttribute('data-name') === itemName) cb.checked = false;
        });
        selectedItems.splice(index, 1);
      }
      renderItems();
      updatePlaceholder();
    }

    function renderItems() {
      const container = document.getElementById("selectedItems");
      if (selectedItems.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#999;">কোন পণ্য যোগ করা হয়নি</p>';
        return;
      }
      let html = "";
      selectedItems.forEach((item, i) => {
        html += `<div class="item-row">
          <span><strong>${item.name}</strong><br><small>${item.price}৳ x ${item.quantity}</small></span>
          <div style="display:flex; align-items:center; gap:10px;">
            <strong style="color:var(--text-color); font-size: 15px;">৳${item.price * item.quantity}</strong>
            <div class="quantity-buttons no-print">
              <button onclick="changeQty(${i}, 1)">+</button>
              <button onclick="changeQty(${i}, -1)">-</button>
            </div>
          </div>
        </div>`;
      });
      container.innerHTML = html;
    }

    function submitInvoice() {
      if (selectedItems.length === 0) {
        alert("অনুগ্রহ করে অন্তত একটি পণ্য সিলেক্ট করুন।");
        return;
      }
      const productTotal = selectedItems.reduce((s, i) => s + (i.price * i.quantity), 0);
      const delivery = parseInt(document.getElementById("deliveryCharge").value) || 0;
      const discount = parseInt(document.getElementById("discountAmount").value) || 0;
      const paid = parseInt(document.getElementById("paymentAmount").value) || 0;
      
      const totalBill = (productTotal + delivery) - discount;
      const due = totalBill - paid;

      document.getElementById("sumProductTotal").innerText = `৳ ${productTotal}`;
      document.getElementById("sumDelivery").innerText = `৳ ${delivery}`;
      document.getElementById("sumDiscount").innerText = `৳ ${discount}`;
      document.getElementById("sumFinalTotal").innerText = `৳ ${totalBill}`;
      document.getElementById("sumPaid").innerText = `৳ ${paid}`;
      document.getElementById("sumDue").innerText = `৳ ${due}`;
      document.getElementById("finalSummary").style.display = "block";

      let text = `মাটি ও মৃৎশিল্প\nতারিখ: ${document.getElementById("currentDate").textContent}\n\nপণ্যের বিবরণ:\n`;
      selectedItems.forEach(i => text += `- ${i.name} (${i.quantity} পিস) = ৳${i.price * i.quantity}\n`);
      
      text += `\nপণ্যের মূল্য: ৳${productTotal}\n`;
      text += `ডেলিভারি চার্জ: ৳${delivery}\n`;
      if(discount > 0) text += `ডিসকাউন্ট: ৳${discount}\n`;
      text += `সর্বমোট বিল: ৳${totalBill}\n`;
      
      if (paid > 0) {
        text += `\n${paid} টাকা বিকাশ করে অর্ডার কনফার্ম করবেন। বাকি ${due} টাকা পণ্য হাতে পেয়ে ডেলিভারি ম্যানকে দেবেন।\nবিঃদ্রঃ আমাদের সম্পুর্ণ ক্যাশ-অন ডেলিভারি সিষ্টেম নেই।`;
      }
      document.getElementById("invoiceText").value = text;
      document.getElementById("finalSummary").scrollIntoView({ behavior: 'smooth' });
    }

    function copyText() {
      const tx = document.getElementById("invoiceText");
      if(!tx.value) return alert("আগে ইনভয়েজ তৈরি করুন");
      tx.select();
      tx.setSelectionRange(0, 99999);
      document.execCommand("copy");
      alert("টেক্সট কপি হয়েছে!");
    }

    function downloadPDF() {
      submitInvoice();
      const element = document.getElementById("printableArea");
      const opt = {
        margin: 0.3,
        filename: 'Invoice_Mritsilpo.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    function clearAll() {
      if(confirm("আপনি কি নিশ্চিত যে সবকিছু মুছে ফেলতে চান?")) {
        selectedItems = [];
        document.querySelectorAll('#checkboxes input').forEach(cb => cb.checked = false);
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById("invoiceText").value = '';
        document.getElementById("finalSummary").style.display = 'none';
        updatePlaceholder();
        renderItems();
      }
    }

    updateDate();
  </script>
</body>
</html>
